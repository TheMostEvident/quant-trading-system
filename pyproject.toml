[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-system"
version = "0.1.0"
description = "Persistent, point-in-time data foundation for quantitative research"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
quant-foundation = "quant_system.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
